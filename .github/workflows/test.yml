name: Test Pelican generator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            pyproject.toml
      - run: python -m pip install -r requirements.txt
      - run: spg check
      - run: python -m unittest discover -s tests -v
      - name: Install the distributable package and smoke-test its command
        shell: bash
        run: |
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/portfolio-wheels"
          python -m pip install --force-reinstall --no-deps "$RUNNER_TEMP"/portfolio-wheels/*.whl
          spg check
          spg build --output "$RUNNER_TEMP/portfolio-installed-output"

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the website repository's Pages workflow
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          if [ -z "$SITE_DEPLOY_TOKEN" ]; then
            echo "::warning::Tests passed, but publishing is not configured. Add SITE_DEPLOY_TOKEN as described in README.md."
            echo "Publishing skipped: configure SITE_DEPLOY_TOKEN in this repository." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $SITE_DEPLOY_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/shrishtinigam/shrishtinigam.github.io/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'
          echo "Deployment requested. Follow the run in shrishtinigam.github.io → Actions; this dispatch does not confirm deployment success." >> "$GITHUB_STEP_SUMMARY"
